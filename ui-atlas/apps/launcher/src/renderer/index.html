<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      No remote origins, no inline script, no eval. The popover renders local
      state and has no reason to reach the network; saying so here means a
      mistake later fails loudly instead of silently fetching something.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src data:;"
    />
    <title>UI Atlas</title>
  </head>
  <body>
    <script src="./entry.js"></script>
  </body>
</html>
