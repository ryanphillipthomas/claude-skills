# UI Atlas project configuration.
# Every value here is optional; these are the defaults, written out so they are
# easy to find and change. Run `ui-atlas capture <url> --config <path>` to use a
# different file.

project: default
outputRoot: ./ui-atlas-output

# Base viewport for `inspect` and `capture`.
viewport:
  width: 1440
  height: 1000
  deviceScaleFactor: 1

# Presets offered in the inspector. `mode: mobile` means true device emulation
# (touch, mobile user agent, higher device scale), not just a narrower window.
viewports:
  - { name: mobile-sm, width: 375, height: 812, mode: mobile }
  - { name: mobile-lg, width: 430, height: 932, mode: mobile }
  - { name: tablet, width: 768, height: 1024, mode: desktop }
  - { name: laptop, width: 1280, height: 800, mode: desktop }
  - { name: desktop, width: 1440, height: 1000, mode: desktop }

# Bounded readiness. `networkidle` is deliberately not an option: analytics,
# streaming and long polling can keep a page busy forever.
settle:
  totalTimeoutMs: 12000
  mutationQuietMs: 500
  geometryQuietMs: 250
  fontTimeoutMs: 3000
  imageTimeoutMs: 3000
  perImageTimeoutMs: 1500
  loadState: domcontentloaded
  animationFrames: 2

capture:
  # Still captures freeze CSS animations. Motion capture re-enables them.
  disableAnimations: true
  fullPageMaxHeightPx: 20000
  # CSS selectors painted over before capture: clocks, ads, rotating carousels,
  # user-specific data.
  masks: []
  maskColor: '#FF00FF'
  elementPaddingPx: 0
  screenshotTimeoutMs: 20000
  states: [default, hover, focus]
  keyboardFocusMaxTabs: 60
  allowForcedStates: true

browser:
  # clean | profile | storage-state | attach
  mode: clean
  headless: false
  locale: en-US
  colorScheme: light
  reducedMotion: no-preference
  navigationTimeoutMs: 30000

overlay:
  enabled: true
  autoInspect: false
  showBoxModel: false

# `ui-atlas crawl <this file>`. The crawler follows <a href> links and clicks
# nothing at all — no buttons, no forms, no interaction of any kind.
crawl:
  # Where the crawl starts. Each seed's origin is in scope automatically.
  seeds: []
  # Extra in-scope origins, e.g. a separate docs host.
  allowOrigins: []
  # `**` crosses `/`, `*` does not, and a trailing `/**` also matches the parent,
  # so '/checkout/**' excludes '/checkout' too.
  include: ['/**']
  exclude: []
  # Checked before `exclude` and reported separately. Following a sign-out link
  # would end the session the rest of the crawl depends on.
  denyPaths:
    ['**/logout', '**/logout/**', '**/log-out', '**/logoff', '**/signout', '**/signout/**', '**/sign-out', '**/sign_out']
  # `strip` makes /docs and /docs/ one page. The root `/` is never stripped.
  trailingSlash: strip
  query:
    # These say how someone arrived, never which page they arrived at.
    drop: ['utm_*', gclid, gbraid, wbraid, fbclid, msclkid, mc_cid, mc_eid, igshid, _hsenc, _hsmi]
    keep: [] # non-empty turns this into an allowlist
    sort: true # so ?b=2&a=1 and ?a=1&b=2 are one page
    dropAll: false
  # Hard limits, every one of them.
  budgets:
    maxPages: 50
    maxDepth: 3 # seeds are depth 0
    perPageTimeoutMs: 30000
    maxRunMinutes: 30
    maxQueued: 10000 # memory bound on the pending queue
  respectNofollow: true
  # Minimum gap between navigations *to one origin*, enforced across every
  # worker rather than per worker — so raising concurrency never raises the rate
  # one host sees. Crawling flat out is the fastest way to be mistaken for
  # something worth blocking; 0 removes the gap.
  perPageDelayMs: 750
  # Isolated workers, each with its own browser context seeded from the live
  # session. Scale comes from separate workers, not many tabs sharing one
  # mutable session. `browser.mode: profile` cannot create extra contexts and
  # stays at 1 with a warning.
  concurrency: 1
  # Bounded retries for the failures worth retrying. A 429 or 503 additionally
  # holds the whole origin back — it is the host asking for less traffic, not
  # one page going wrong — honouring Retry-After up to maxRetryAfterMs.
  # Retries cost attempts, never pages, and every wait is clamped by the run
  # budget. maxAttempts: 1 turns retrying off.
  retry:
    maxAttempts: 3
    baseDelayMs: 500 # doubles each attempt
    maxDelayMs: 15000
    jitter: 0.3 # so workers that failed together do not retry together
    retryStatuses: [408, 425, 429, 500, 502, 503, 504]
    backoffStatuses: [429, 503]
    maxRetryAfterMs: 120000
  # A Playwright trace for the pages that failed, and only those. Off by
  # default on purpose: a trace records network traffic including request
  # headers, so one taken during an authenticated crawl contains the session
  # cookie that authenticated it. Nothing is written for a page that worked, an
  # error status does not count as a failure, and the report never links them.
  trace:
    enabled: false
    maxTraces: 20
    screenshots: true
    snapshots: true
  # The only way the crawler interacts with a page. Without a matching recipe it
  # navigates, reads links and touches nothing. Writing a recipe is what approves
  # the interaction, so `--dry-run` prints every control one would click.
  #
  # There is deliberately no step that types text: no fill, no type, no evaluate.
  # Sign in by hand with `ui-atlas auth save <profile> <url>`, then crawl with
  # `--mode storage-state --profile <profile>`.
  #
  #   recipes:
  #     - name: open-primary-navigation
  #       match: '/**'
  #       steps:
  #         - hover: { role: button, name: Menu }
  #         - waitFor: { role: navigation }
  #         - capture: { kind: viewport, label: nav-open }
  recipes: []
  # Lists each page's interactive controls and classifies what each is likely to
  # do — navigation, inert, mutation or unknown. It reads and nothing else: no
  # clicking, no hovering. Writes interactions.jsonl plus a suggested-recipes.yml
  # you can review and edit. `--inventory` switches it on for one run.
  inventory:
    enabled: false
    # Added to the built-in list (delete, buy, send, save, sign out, ...), not
    # replacing it. Matched against the accessible name and visible text.
    mutationWords: []
    maxPerPage: 200
    writeSuggestions: true

# Redacted before anything is logged.
redact:
  headers: [authorization, cookie, set-cookie, proxy-authorization, x-api-key]
  fields: [password, token, secret, apiKey, accessToken, refreshToken]
